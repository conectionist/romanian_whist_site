<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site footer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<footer lang="{{lang}}" style="width: 100%; box-sizing: border-box; border-top: 1px solid rgba(226,182,90,0.4); background: rgba(4,16,11,0.85); font-family: 'Alegreya Sans', sans-serif; font-size: 15px; line-height: 1.5; color: #c3cdbd">
  <div style="max-width: 1280px; margin: 0 auto; padding: 44px 48px 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 36px 64px">
    <div style="flex: 2 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #f3ead6; text-decoration: none">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><path fill="#e2b65a" d="M12 2.5C9.3 6.2 4 9.4 4 13.6c0 2.6 2 4.6 4.5 4.6 1.2 0 2.3-.5 3-1.3-.2 1.7-.9 3.1-2.2 4.1h5.4c-1.3-1-2-2.4-2.2-4.1.7.8 1.8 1.3 3 1.3 2.5 0 4.5-2 4.5-4.6 0-4.2-5.3-7.4-8-11.1z"/></svg>
        <span style="font-family: 'Playfair Display', serif; font-weight: 600; font-size: 20px">{{t.brand}}</span>
      </a>
      <p style="margin: 0; max-width: 340px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 21px; color: #e2d6b8">{{t.motto}}</p>
      <p style="margin: 0; max-width: 360px">{{t.blurb}}</p>
    </div>
    <nav aria-label="{{t.play}}" style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #e2b65a">{{t.play}}</h2>
      <a href="https://whist.akdscloud.eu" style="color: #e9e1cd; text-decoration: none">{{t.playOnline}}</a>
      <a href="Downloads.dc.html" style="color: #e9e1cd; text-decoration: none">{{t.downloads}}</a>
      <a href="Screenshots.dc.html" style="color: #e9e1cd; text-decoration: none">{{t.screenshots}}</a>
      <a href="About.dc.html#rules" style="color: #e9e1cd; text-decoration: none">{{t.rules}}</a>
    </nav>
    <nav aria-label="{{t.source}}" style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #e2b65a">{{t.source}}</h2>
      <a href="https://github.com/conectionist/romanian_whist_engine" style="color: #e9e1cd; text-decoration: none">{{t.engine}}</a>
      <a href="https://github.com/conectionist/romanian_whist_desktop" style="color: #e9e1cd; text-decoration: none">Desktop</a>
      <a href="https://github.com/conectionist/romanian_whist_terminal" style="color: #e9e1cd; text-decoration: none">Terminal</a>
      <a href="https://github.com/conectionist/romanian_whist_web" style="color: #e9e1cd; text-decoration: none">Browser</a>
      <a href="https://github.com/conectionist/romanian_whist_server" style="color: #e9e1cd; text-decoration: none">Server</a>
    </nav>
    <div style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: #e2b65a">{{t.help}}</h2>
      <a href="https://github.com/conectionist/romanian_whist_desktop/issues" style="color: #e9e1cd; text-decoration: none">{{t.report}}</a>
      <a href="About.dc.html" style="color: #e9e1cd; text-decoration: none">{{t.about}}</a>
    </div>
  </div>
  <div style="max-width: 1280px; margin: 0 auto; padding: 16px 48px 28px; box-sizing: border-box; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; border-top: 1px solid rgba(226,182,90,0.18); font-size: 14px; color: #a9b5a6">
    <span>© 2026 {{t.brand}}</span>
    <span>{{t.licences}}</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["ro","en"],"default":"ro"},"$preview":{"width":1440,"height":300}}'>
class Component extends DCLogic {
texts(lang) {
  if (lang === 'ro') {
    return {
      brand: 'Whist',
      motto: 'Un singur joc. Oriunde.',
      blurb: 'Gratuit și open source. Toate versiunile sunt construite pe același motor de joc.',
      play: 'Joacă', playOnline: 'Joacă online', downloads: 'Descărcări', screenshots: 'Imagini', rules: 'Regulament',
      source: 'Cod sursă', engine: 'Motorul de joc',
      help: 'Ajutor', report: 'Raportează o problemă', about: 'Despre',
      licences: 'Aplicațiile sub GPL-3.0; motorul, serverul și pagina web sub AGPL-3.0'
    };
  }
  return {
    brand: 'Romanian Whist',
    motto: 'One game. Everywhere.',
    blurb: 'Free and open source. Every version is built on the same game engine.',
    play: 'Play', playOnline: 'Play online', downloads: 'Downloads', screenshots: 'Screenshots', rules: 'Rules',
    source: 'Source code', engine: 'Engine',
    help: 'Help', report: 'Report a problem', about: 'About',
    licences: 'Apps under GPL-3.0; the engine, server and browser page under AGPL-3.0'
  };
}
renderVals() {
const lang = this.props.lang ?? 'ro';
return { lang, t: this.texts(lang) };
}
}
</script>
</body>
</html>
